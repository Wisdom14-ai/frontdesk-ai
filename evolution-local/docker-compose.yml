services:
  postgres:
    container_name: evolution_postgres
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data

  redis:
    container_name: evolution_redis
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data

  evolution-api:
    container_name: evolution_api
    # Pinned to the digest running in prod as of 2026-07-03 (reported version 2.3.7).
    # Do NOT move to :latest or a floating tag — a surprise upgrade can break
    # every clinic's WhatsApp connection at once.
    image: evoapicloud/evolution-api@sha256:6b195676b09abbbd8ac9372cd961674dea2587f23dc9bc1d1e6a595372556fb1
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_postgres:
  evolution_redis:
  evolution_instances:
