name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontdesk-ai-vps
  cancel-in-progress: true

jobs:
  deploy:
    # Runs on the self-hosted runner installed ON the VPS. The runner polls
    # GitHub outbound over HTTPS, so GitHub never needs inbound access to the
    # VPS (which the GitHub-hosted runners could not reach). The deploy happens
    # locally on the box — no SSH/rsync-over-network required.
    runs-on: [self-hosted, vps]
    permissions:
      contents: read

    env:
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
      APP_URL: https://app.frontdesk-ai.cloud

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Write build info
        shell: bash
        run: |
          mkdir -p public
          cat > public/build-info.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF_NAME}",
            "run_id": "${GITHUB_RUN_ID}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat public/build-info.json

      - name: Sync checkout into deploy directory
        shell: bash
        run: |
          if [ -z "${VPS_DEPLOY_PATH}" ]; then
            echo "::error::VPS_DEPLOY_PATH repository variable is not set."
            exit 1
          fi
          mkdir -p "${VPS_DEPLOY_PATH}"
          # Preserve runtime secrets/state in the target; never delete them.
          rsync -a --delete \
            --filter='P .env.local' \
            --filter='P evolution-local/.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='test-results/' \
            --exclude='playwright-report/' \
            --exclude='*.log' \
            --exclude='*.err' \
            "${GITHUB_WORKSPACE}/" "${VPS_DEPLOY_PATH}/"

      - name: Build and reload app
        shell: bash
        working-directory: ${{ vars.VPS_DEPLOY_PATH }}
        run: |
          chmod +x scripts/deploy-vps.sh
          ./scripts/deploy-vps.sh

      - name: Verify deployed commit
        shell: bash
        run: |
          deployed_commit=""
          for attempt in $(seq 1 10); do
            deployed_commit="$(curl --fail --silent --max-time 15 "${APP_URL}/build-info.json" | jq -r '.commit // empty' || true)"
            if [ "$deployed_commit" = "$GITHUB_SHA" ]; then
              echo "Verified: ${APP_URL} is serving commit ${GITHUB_SHA}."
              echo "✅ Deploy verified: \`${GITHUB_SHA}\` is live at ${APP_URL}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt ${attempt}/10: ${APP_URL}/build-info.json reports '${deployed_commit:-<unavailable>}', expected ${GITHUB_SHA}."
            sleep 10
          done
          echo "::error::Deploy verification failed: ${APP_URL}/build-info.json does not report the pushed commit ${GITHUB_SHA} (last seen: '${deployed_commit:-<unavailable>}')."
          echo "❌ Deploy verification failed: live app does not report commit \`${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
          exit 1
