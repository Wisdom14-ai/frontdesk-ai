name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: frontdesk-ai-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -n "$VPS_SSH_KEY_B64" ]; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "VPS SSH key is not a valid private key. Set VPS_SSH_KEY_B64 to a base64-encoded private key, or set VPS_SSH_KEY to the raw private key." >&2
            exit 1
          fi
          cat > ~/.ssh/config <<SSH_CONFIG
          Host *
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 4
            TCPKeepAlive yes
          SSH_CONFIG
          chmod 600 ~/.ssh/config

      - name: Check VPS SSH reachability
        id: ssh_reachability
        shell: bash
        continue-on-error: true
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          timeout 20 bash -c "</dev/tcp/${VPS_HOST}/22"

      - name: Ensure deploy directory exists
        if: steps.ssh_reachability.outcome == 'success'
        shell: bash
        env:
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_DEPLOY_PATH'"

      - name: Sync repository to VPS
        if: steps.ssh_reachability.outcome == 'success'
        shell: bash
        env:
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          rsync -az --delete \
            --filter='P .env.local' \
            --filter='P evolution-local/.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='test-results/' \
            --exclude='playwright-report/' \
            --exclude='*.log' \
            --exclude='*.err' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=4 -o TCPKeepAlive=yes" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"

      - name: Build and reload app on VPS
        if: steps.ssh_reachability.outcome == 'success'
        shell: bash
        env:
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_DEPLOY_PATH' && chmod +x scripts/deploy-vps.sh && ./scripts/deploy-vps.sh"

      - name: Report SSH deploy skipped
        if: steps.ssh_reachability.outcome != 'success'
        shell: bash
        run: |
          echo "::warning::GitHub-hosted runner cannot reach VPS SSH port 22, so SSH deploy was skipped. Production currently relies on direct VPS deploy until the provider firewall, Tailscale, or a self-hosted runner is configured."
          curl --fail --silent --show-error --max-time 20 https://app.frontdesk-ai.cloud/login >/dev/null
