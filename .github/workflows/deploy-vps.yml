name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontdesk-ai-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -n "$VPS_SSH_KEY_B64" ]; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "VPS SSH key is not a valid private key. Set VPS_SSH_KEY_B64 to a base64-encoded private key, or set VPS_SSH_KEY to the raw private key." >&2
            exit 1
          fi
          cat > ~/.ssh/config <<SSH_CONFIG
          Host *
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentityFile ~/.ssh/id_ed25519
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 4
            TCPKeepAlive yes
          SSH_CONFIG
          chmod 600 ~/.ssh/config

      - name: Check VPS SSH reachability
        id: ssh_reachability
        shell: bash
        continue-on-error: true
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          for attempt in 1 2 3 4 5; do
            if timeout 20 bash -c "</dev/tcp/${VPS_HOST}/22"; then
              echo "VPS SSH port 22 is reachable (attempt ${attempt})."
              exit 0
            fi
            echo "Attempt ${attempt}/5: cannot reach ${VPS_HOST}:22 from this runner."
            if [ "$attempt" -lt 5 ]; then
              sleep 20
            fi
          done
          exit 1

      - name: Write build info
        if: steps.ssh_reachability.outcome == 'success'
        shell: bash
        run: |
          mkdir -p public
          cat > public/build-info.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF_NAME}",
            "run_id": "${GITHUB_RUN_ID}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat public/build-info.json

      - name: Ensure deploy directory exists
        if: steps.ssh_reachability.outcome == 'success'
        shell: bash
        env:
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_DEPLOY_PATH'"

      - name: Sync repository to VPS
        if: steps.ssh_reachability.outcome == 'success'
        shell: bash
        env:
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          rsync -az --delete \
            --filter='P .env.local' \
            --filter='P evolution-local/.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='test-results/' \
            --exclude='playwright-report/' \
            --exclude='*.log' \
            --exclude='*.err' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=4 -o TCPKeepAlive=yes" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"

      - name: Build and reload app on VPS
        if: steps.ssh_reachability.outcome == 'success'
        shell: bash
        env:
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            -o TCPKeepAlive=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_DEPLOY_PATH' && chmod +x scripts/deploy-vps.sh && ./scripts/deploy-vps.sh"

      - name: Verify deployed commit
        if: steps.ssh_reachability.outcome == 'success'
        shell: bash
        env:
          APP_URL: https://app.frontdesk-ai.cloud
        run: |
          deployed_commit=""
          for attempt in $(seq 1 10); do
            deployed_commit="$(curl --fail --silent --max-time 15 "${APP_URL}/build-info.json" | jq -r '.commit // empty' || true)"
            if [ "$deployed_commit" = "$GITHUB_SHA" ]; then
              echo "Verified: ${APP_URL} is serving commit ${GITHUB_SHA}."
              echo "✅ Deploy verified: \`${GITHUB_SHA}\` is live at ${APP_URL}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt ${attempt}/10: ${APP_URL}/build-info.json reports '${deployed_commit:-<unavailable>}', expected ${GITHUB_SHA}."
            sleep 10
          done
          echo "::error::Deploy verification failed: ${APP_URL}/build-info.json does not report the pushed commit ${GITHUB_SHA} (last seen: '${deployed_commit:-<unavailable>}'). The deploy steps ran, but the live app does not match this commit."
          echo "❌ Deploy verification failed: live app does not report commit \`${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Fail when VPS is unreachable
        if: steps.ssh_reachability.outcome != 'success'
        shell: bash
        run: |
          echo "::error::GitHub-hosted runner cannot reach VPS SSH port 22 after 5 attempts, so the deploy DID NOT happen. Commit ${GITHUB_SHA} is NOT deployed. Check the provider firewall, Tailscale, or run scripts/deploy-vps.sh directly on the VPS; consider a self-hosted runner."
          echo "❌ Deploy skipped: VPS SSH port 22 unreachable from GitHub runner. Commit \`${GITHUB_SHA}\` is **not** deployed." >> "$GITHUB_STEP_SUMMARY"
          if ! curl --fail --silent --show-error --max-time 20 https://app.frontdesk-ai.cloud/login >/dev/null; then
            echo "::error::The public app URL https://app.frontdesk-ai.cloud/login is also unreachable from this runner — the VPS may be down entirely."
            echo "❌ Public URL https://app.frontdesk-ai.cloud/login is also unreachable — VPS may be down." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
