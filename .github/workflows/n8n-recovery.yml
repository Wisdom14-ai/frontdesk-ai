name: Recover n8n Access

on:
  push:
    branches:
      - codex/n8n-recovery-20260424

concurrency:
  group: frontdesk-ai-n8n-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -n "$VPS_SSH_KEY_B64" ]; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "VPS SSH key is not a valid private key." >&2
            exit 1
          fi
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Recover n8n container and reset access
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash -s" <<'EOF'
          set -euo pipefail

          DOCKER_CMD=""
          if command -v docker >/dev/null 2>&1; then
            if docker ps >/dev/null 2>&1; then
              DOCKER_CMD="docker"
            elif sudo docker ps >/dev/null 2>&1; then
              DOCKER_CMD="sudo docker"
            fi
          fi

          if [ -n "$DOCKER_CMD" ]; then
            CONTAINER="$($DOCKER_CMD ps -a --format '{{.Names}}\t{{.Image}}' | awk 'tolower($0) ~ /n8n/ { print $1; exit }')"
            if [ -n "$CONTAINER" ]; then
              if [ "$($DOCKER_CMD inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
                $DOCKER_CMD start "$CONTAINER"
                sleep 10
              fi
              printf 'y\n' | $DOCKER_CMD exec -i -u node "$CONTAINER" n8n user-management:reset || true
              $DOCKER_CMD restart "$CONTAINER"
              sleep 15
              $DOCKER_CMD ps -a --filter "name=^${CONTAINER}$"
              exit 0
            fi
          fi

          if command -v n8n >/dev/null 2>&1; then
            printf 'y\n' | n8n user-management:reset || true
            if command -v systemctl >/dev/null 2>&1; then
              sudo systemctl restart n8n || systemctl restart n8n
            fi
            exit 0
          fi

          echo "Unable to find an n8n Docker container or n8n binary on the VPS." >&2
          exit 1
          EOF
