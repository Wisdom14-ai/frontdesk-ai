name: Add Sentry DSN to VPS

on:
  workflow_dispatch:

jobs:
  add-sentry-dsn:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh

          # Try base64 key first, fall back to raw key if decode fails
          KEY_WRITTEN=false
          if [ -n "$VPS_SSH_KEY_B64" ]; then
            if printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519 2>/dev/null; then
              echo "Using VPS_SSH_KEY_B64"
              KEY_WRITTEN=true
            else
              echo "VPS_SSH_KEY_B64 is not valid base64, trying VPS_SSH_KEY..."
            fi
          fi

          if [ "$KEY_WRITTEN" = false ]; then
            if [ -n "$VPS_SSH_KEY" ]; then
              printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
              echo "Using VPS_SSH_KEY"
              KEY_WRITTEN=true
            fi
          fi

          if [ "$KEY_WRITTEN" = false ]; then
            echo "ERROR: No valid SSH key found in VPS_SSH_KEY_B64 or VPS_SSH_KEY secrets." >&2
            exit 1
          fi

          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "ERROR: SSH key is not a valid private key." >&2; exit 1; }

          cat > ~/.ssh/config <<SSH_CONFIG
          Host *
            StrictHostKeyChecking accept-new
            IdentityFile ~/.ssh/id_ed25519
            ServerAliveInterval 30
          SSH_CONFIG
          chmod 600 ~/.ssh/config
          echo "SSH configured successfully."

      - name: Add Sentry DSN to .env.local
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash << 'ENVSSH'
            ENV_FILE="/var/www/frontdesk-ai/.env.local"
            DSN="https://0ff66359895eace0333e37bd3cdb3059@o4511323865415680.ingest.us.sentry.io/4511323870461952"

            # Remove any existing Sentry DSN lines (avoid duplicates)
            sed -i '/^NEXT_PUBLIC_SENTRY_DSN=/d' "$ENV_FILE"
            sed -i '/^SENTRY_DSN=/d' "$ENV_FILE"

            # Append fresh values
            echo "NEXT_PUBLIC_SENTRY_DSN=$DSN" >> "$ENV_FILE"
            echo "SENTRY_DSN=$DSN" >> "$ENV_FILE"

            echo "✅ Sentry DSN added to $ENV_FILE"
            grep "SENTRY_DSN" "$ENV_FILE"
          ENVSSH

      - name: Restart app with pm2
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "pm2 restart frontdesk-ai && pm2 save"
          echo "✅ App restarted. Sentry is now live!"
